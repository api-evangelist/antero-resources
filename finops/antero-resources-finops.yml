      - period
principles:
  - name: Visibility
    description: >-
      Track EDGAR consumption client-side via consumer logs / metrics, since
      the SEC does not issue per-account telemetry.
  - name: Allocation
    description: >-
      Allocate consumer-side ETL costs to the team that owns the financial
      data pipeline ingesting Antero filings.
  - name: Optimization
    description: >-
      Cache filings (immutable once published), poll the submissions index
      daily rather than per filing type, and respect the 10 req/sec ceiling.
  - name: Accountability
    description: >-
      Data engineering owns the pipeline; finance / research owns the use of
      the data downstream.
