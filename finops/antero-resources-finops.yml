description: >-
  FOCUS-aligned FinOps for Antero Resources data access. The reachable
  endpoint is SEC EDGAR, which is free public data; there is no charge to
  reconcile. FinOps practitioners track only the consumer-side compute /
  egress cost of polling EDGAR, not a vendor invoice from Antero or the SEC.
notes: >-
  No vendor invoice. Spend is consumer-side infrastructure (egress, storage,
  ETL).
