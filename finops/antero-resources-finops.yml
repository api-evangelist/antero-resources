meters:
  - name: edgar_requests
    description: Count of requests to data.sec.gov for Antero Resources filings (free)
    unit: request
    aggregation: sum
    dimensions:
      - endpoint
      - cik
      - filing_type
  - name: filings_ingested
    description: Distinct filing artifacts processed downstream
    unit: filing
    aggregation: count
    dimensions:
