description: >-
  Antero Resources (NYSE: AR) does not publish a first-party developer API or
  pricing catalog. The data surface tracked by api-evangelist is the SEC EDGAR
  filings endpoint for CIK 0001433270, which is operated by the U.S.
  Securities and Exchange Commission and is free to access for the public,
  with no API plan tiers or per-request fees.
notes: >-
